          content:
            value: "This section was our journal from our February 2003 trip to Central Mexico. We rode our bicycles from Guadalajara, Mexico to Morelia, Toluca, Taxco, Oaxaca, Puerto Escondido, and Acapulco.\r\n<br/><br/>\r\nWe left on February 15, 2003 and started riding on the 17th. We had an incredible month-long trip, culminating with a little beach vacation for three days near Acapulco, then returned from there on March 17. \r\n<br/><br/>\r\nPlease enjoy your visit and if you have any questions or comments feel free to email <script language=\"Javascript\" type=\"text/javascript\">\r\n<!--\r\ndocument.write('<a href=\"mai');\r\ndocument.write('lto');\r\ndocument.write(':&#114;&#97;&#110;&#100;&#121;&#65;&#110;&#100;&#78;&#97;&#110;&#99;&#121;');\r\ndocument.write('@');\r\ndocument.write('&#104;&#111;&#98;&#111;&#98;&#105;&#107;&#101;&#114;&#46;&#99;&#111;&#109;\">');\r\ndocument.write('&#114;&#97;&#110;&#100;&#121;&#65;&#110;&#100;&#78;&#97;&#110;&#99;&#121;');\r\ndocument.write('@');\r\ndocument.write('&#104;&#111;&#98;&#111;&#98;&#105;&#107;&#101;&#114;&#46;&#99;&#111;&#109;<\\/a>');\r\n// -->\r\n</script><noscript>&#114;&#97;&#110;&#100;&#121;&#65;&#110;&#100;&#78;&#97;&#110;&#99;&#121; at \r\n&#104;&#111;&#98;&#111;&#98;&#105;&#107;&#101;&#114; dot &#99;&#111;&#109;</noscript>.\r\n<br/><br/>\r\n\r\n"
