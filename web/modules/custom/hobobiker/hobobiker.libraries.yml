# Leaflet with OpenStreetMap tiles and the KML/KMZ loaders, served from this module (the D6 tripinfo module's lib/).
tripinfo_map:
  version: VERSION
  css:
    component:
      lib/leaflet-1.9.4/leaflet.css: {}
  js:
    lib/leaflet-1.9.4/leaflet.js: { minified: true }
    lib/togeojson-5.8.1/togeojson.umd.js: { minified: true }
    lib/jszip-3.10.1/jszip.min.js: { minified: true }
    js/tripinfo_filtermap.js: {}

# The D6 Lightbox2 module (6.x-1.12) that the [hobophoto:] links and the blog photos open in: its script, CSS and
# images unchanged, its settings as the original printed them, and an adapter for Drupal 11 (js/lightbox2.js).
lightbox2:
  version: 6.x-1.12
  css:
    component:
      lib/lightbox2-6.x-1.12/css/lightbox.css: {}
  js:
    lib/lightbox2-6.x-1.12/js/lightbox.js: {}
    js/lightbox2.js: {}
  dependencies:
    - core/jquery
    - core/drupal
    - core/drupalSettings
  drupalSettings:
    lightbox2:
      rtl: 0
      file_path: '/(\w\w/)sites/default/files'
      default_image: '/modules/custom/hobobiker/lib/lightbox2-6.x-1.12/images/brokenimage.jpg'
      border_size: 10
      font_color: '000'
      box_color: fff
      top_position: ''
      overlay_opacity: '0.8'
      overlay_color: '000'
      disable_close_click: 1
      resize_sequence: 0
      resize_speed: 400
      fade_in_speed: 400
      slide_down_speed: 600
      use_alt_layout: 0
      disable_resize: 0
      disable_zoom: 0
      force_show_nav: 0
      show_caption: 1
      loop_items: 0
      node_link_text: 'View Image Details'
      node_link_target: 0
      image_count: 'Image !current of !total'
      video_count: 'Video !current of !total'
      page_count: 'Page !current of !total'
      lite_press_x_close: 'press <a href="#" onclick="hideLightbox(); return FALSE;"><kbd>x</kbd></a> to close'
      download_link_text: ''
      enable_login: false
      enable_contact: false
      keys_close: 'c x 27'
      keys_previous: 'p 37'
      keys_next: 'n 39'
      keys_zoom: z
      keys_play_pause: '32'
      display_image_size: original
      image_node_sizes: '()'
      trigger_lightbox_classes: ''
      trigger_lightbox_group_classes: ''
      trigger_slideshow_classes: ''
      trigger_lightframe_classes: ''
      trigger_lightframe_group_classes: ''
      custom_class_handler: 0
      custom_trigger_classes: ''
      disable_for_gallery_lists: true
      disable_for_acidfree_gallery_lists: true
      enable_acidfree_videos: true
      slideshow_interval: 5000
      slideshow_automatic_start: true
      slideshow_automatic_exit: true
      show_play_pause: true
      pause_on_next_click: false
      pause_on_previous_click: true
      loop_slides: false
      iframe_width: 600
      iframe_height: 400
      iframe_border: 1
      enable_video: 0
