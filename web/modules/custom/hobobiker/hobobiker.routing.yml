# The D6 tripinfo module's pages, same paths and arguments.
hobobiker.tripinfo:
  path: '/tripinfo/{startdate}/{enddate}'
  defaults:
    _controller: '\Drupal\hobobiker\Controller\TripinfoController::list'
    _title: 'Hobobiker Trip Details'
    startdate: ''
    enddate: ''
  requirements:
    _permission: 'access content'

hobobiker.tripinfo_item:
  path: '/tripinfo_item/{date}/{startdate}/{enddate}'
  defaults:
    _controller: '\Drupal\hobobiker\Controller\TripinfoController::item'
    _title: ''
    date: ''
    startdate: ''
    enddate: ''
  requirements:
    _permission: 'access content'

# The D6 front page, a Panel at trip_wrapped_up (no page title).
hobobiker.front:
  path: '/trip_wrapped_up'
  defaults:
    _controller: '\Drupal\hobobiker\Controller\FrontController::page'
    _title: ''
  requirements:
    _permission: 'access content'

# The D6 audio module's pages.
hobobiker.audio_by:
  path: '/audio/by/{tag}/{value}'
  defaults:
    _controller: '\Drupal\hobobiker\Controller\AudioController::browse'
    _title_callback: '\Drupal\hobobiker\Controller\AudioController::title'
    tag: ~
    value: ~
  requirements:
    _permission: 'access content'

hobobiker.audio_download:
  path: '/audio/download/{node}/{filename}'
  defaults:
    _controller: '\Drupal\hobobiker\Controller\AudioController::download'
    filename: ''
  requirements:
    _entity_access: 'node.view'
  options:
    parameters:
      node:
        type: entity:node

# Lightbox2's caption filter: the script posts each caption here before showing it.
hobobiker.lightbox2_filter_xss:
  path: '/system/lightbox2/filter-xss'
  defaults:
    _controller: '\Drupal\hobobiker\Controller\Lightbox2Controller::filterXss'
  methods: [POST]
  requirements:
    _access: 'TRUE'
